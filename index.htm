<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Veedzi Sports - Live Cricket, Football & Sports Streaming HD</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    body { font-family: 'Inter', sans-serif; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #0F172A; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
    .aspect-video-container {
      position: relative;
      padding-bottom: 56.25%;
      height: 0;
      overflow: hidden;
    }
    .aspect-video-container iframe {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%; border: 0;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col">

  <!-- TOP AD BANNER -->
  <div class="bg-slate-900 border-b border-slate-800 py-2 px-4 text-center text-xs">
    <div class="max-w-7xl mx-auto flex items-center justify-between">
      <span class="text-[10px] text-slate-400 uppercase font-semibold">Advertisement (Top Banner)</span>
      <span id="top-ad-timer" class="text-[10px] text-blue-400">Rotates in: 15s</span>
    </div>
    <div id="ad-slot-top" class="w-full max-w-[728px] h-[90px] bg-slate-800 mx-auto mt-1 rounded flex items-center justify-center overflow-hidden shadow-md"></div>
  </div>

  <!-- HEADER -->
  <header class="bg-slate-900 border-b border-slate-800 sticky top-0 z-40">
    <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
      <div class="flex items-center space-x-2">
        <div class="w-9 h-9 bg-emerald-500 rounded-lg flex items-center justify-center text-slate-950 font-bold text-lg shadow-lg">
          <i class="fa-solid fa-bolt"></i>
        </div>
        <span class="text-xl font-black text-white">Veedzi<span class="text-emerald-400">Sports</span></span>
      </div>

      <!-- Category Filter Buttons -->
      <nav class="hidden md:flex space-x-2 text-sm font-semibold">
        <button onclick="filterMatches('all')" id="cat-all" class="px-3 py-1.5 rounded bg-emerald-600 text-white transition">All Matches</button>
        <button onclick="filterMatches('Cricket')" id="cat-Cricket" class="px-3 py-1.5 rounded bg-slate-800 text-slate-300 hover:bg-slate-700 transition">Cricket</button>
        <button onclick="filterMatches('Football')" id="cat-Football" class="px-3 py-1.5 rounded bg-slate-800 text-slate-300 hover:bg-slate-700 transition">Football</button>
        <button onclick="filterMatches('Tennis')" id="cat-Tennis" class="px-3 py-1.5 rounded bg-slate-800 text-slate-300 hover:bg-slate-700 transition">Tennis</button>
      </nav>

      <button onclick="openAdModal()" class="bg-amber-500/10 text-amber-400 border border-amber-500/30 text-xs px-3 py-2 rounded-lg font-semibold flex items-center gap-1.5">
        <i class="fa-solid fa-ad"></i> Ad Manager
      </button>
    </div>
  </header>

  <!-- MAIN CONTENT -->
  <main class="max-w-7xl mx-auto px-4 py-6 flex-1 w-full grid grid-cols-1 lg:grid-cols-12 gap-6">
    
    <!-- LEFT STREAM PLAYER & FIXTURES -->
    <div class="lg:col-span-8 space-y-6">
      
      <!-- PLAYER -->
      <div class="bg-slate-900 border border-slate-800 rounded-xl overflow-hidden shadow-2xl">
        <div class="bg-slate-950 px-4 py-3 border-b border-slate-800 flex flex-wrap items-center justify-between gap-2">
          <div class="flex items-center gap-2">
            <span id="current-category" class="bg-emerald-500/20 text-emerald-400 text-[10px] font-bold uppercase px-2 py-0.5 rounded">Cricket</span>
            <h2 id="current-stream-title" class="text-sm sm:text-base font-bold text-white truncate">Star Sports 1 HD - Live Stream</h2>
          </div>
          <div class="flex items-center gap-1 text-xs">
            <span class="text-slate-400 mr-1">Servers:</span>
            <button onclick="switchServer(1)" id="srv-1" class="px-2.5 py-1 rounded bg-emerald-600 text-white font-semibold">S1</button>
            <button onclick="switchServer(2)" id="srv-2" class="px-2.5 py-1 rounded bg-slate-800 text-slate-300 hover:bg-slate-700">S2</button>
            <button onclick="switchServer(3)" id="srv-3" class="px-2.5 py-1 rounded bg-slate-800 text-slate-300 hover:bg-slate-700">S3</button>
          </div>
        </div>

        <div class="bg-black aspect-video-container relative">
          <iframe id="main-player" src="https://www.youtube.com/embed/live_stream?channel=UC4R8DWoMoI7CAwX8_LjQHig" allowfullscreen allow="autoplay"></iframe>
        </div>
      </div>

      <!-- IN-CONTENT AD BANNER -->
      <div class="bg-slate-900 border border-slate-800 rounded-xl p-3 text-center">
        <div class="flex justify-between text-[10px] text-slate-400 uppercase font-semibold mb-1">
          <span>In-Content Ad Banner</span>
          <span id="player-ad-timer" class="text-blue-400">Rotates in: 15s</span>
        </div>
        <div id="ad-slot-player" class="w-full h-[100px] bg-slate-950 border border-slate-800 rounded flex items-center justify-center overflow-hidden"></div>
      </div>

      <!-- MATCHES FIXTURES -->
      <div class="bg-slate-900 border border-slate-800 rounded-xl p-4">
        <h3 class="text-base font-bold text-white mb-3 flex items-center gap-2">
          <i class="fa-solid fa-tower-broadcast text-red-500"></i> Live Sports Fixtures & Channels
        </h3>
        <div id="matches-list" class="space-y-2.5"></div>
      </div>
    </div>

    <!-- RIGHT SIDEBAR (CHANNELS & AD) -->
    <div class="lg:col-span-4 space-y-6">
      
      <!-- SIDEBAR AD -->
      <div class="bg-slate-900 border border-slate-800 rounded-xl p-3 text-center">
        <div class="flex justify-between text-[10px] text-slate-400 uppercase font-semibold mb-1">
          <span>Sidebar Ad Banner</span>
          <span id="sidebar-ad-timer" class="text-blue-400">Rotates in: 15s</span>
        </div>
        <div id="ad-slot-sidebar" class="w-full h-[250px] bg-slate-950 border border-slate-800 rounded flex items-center justify-center overflow-hidden"></div>
      </div>

      <!-- 24/7 CHANNELS -->
      <div class="bg-slate-900 border border-slate-800 rounded-xl p-4">
        <h3 class="text-base font-bold text-white mb-3 flex items-center gap-2">
          <i class="fa-solid fa-tv text-emerald-400"></i> Popular Live Channels
        </h3>
        <div class="grid grid-cols-2 gap-2" id="channels-grid"></div>
      </div>
    </div>
  </main>

  <!-- AD MANAGER MODAL -->
  <div id="ad-modal" class="fixed inset-0 bg-black/80 z-50 hidden flex items-center justify-center p-4">
    <div class="bg-slate-900 border border-slate-700 w-full max-w-lg rounded-xl p-6 space-y-4 shadow-2xl">
      <div class="flex justify-between items-center border-b border-slate-800 pb-3">
        <h3 class="text-lg font-bold text-white">Dynamic Ad Banner Manager</h3>
        <button onclick="closeAdModal()" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark text-xl"></i></button>
      </div>
      <form id="add-ad-form" onsubmit="handleAddNewAd(event)" class="space-y-3 text-xs">
        <input type="text" id="ad-title" placeholder="Banner Title" required class="w-full bg-slate-950 border border-slate-700 rounded p-2 text-white">
        <input type="url" id="ad-target-url" placeholder="Target Link (https://...)" class="w-full bg-slate-950 border border-slate-700 rounded p-2 text-white">
        <textarea id="ad-content" rows="2" placeholder="Image URL or <iframe> snippet" required class="w-full bg-slate-950 border border-slate-700 rounded p-2 text-white font-mono"></textarea>
        <button type="submit" class="w-full bg-amber-500 text-slate-950 font-bold py-2 rounded">Add Ad to Rotation Pool</button>
      </form>
      <div class="flex justify-end">
        <button onclick="closeAdModal()" class="bg-slate-800 text-white px-4 py-2 rounded text-xs">Close</button>
      </div>
    </div>
  </div>

  <!-- JAVASCRIPT LOGIC -->
  <script>
    const matchesData = [
      {
        id: 'm1',
        category: 'Cricket',
        league: 'Star Sports 1 HD',
        team1: 'Star Sports 1',
        team2: 'Live Broadcast',
        servers: [
          'https://www.youtube.com/embed/live_stream?channel=UC4R8DWoMoI7CAwX8_LjQHig',
          'https://www.redbull.com/embed/v3/tv/live/rrn:content:live-events:3a0f1fa8-1f14-411a-8e2b-231a48c6883e/en-INT'
        ]
      },
      {
        id: 'm2',
        category: 'Cricket',
        league: 'Ten Sports HD',
        team1: 'Ten Sports',
        team2: 'Cricket Live',
        servers: [
          'https://www.youtube.com/embed/live_stream?channel=UC4R8DWoMoI7CAwX8_LjQHig'
        ]
      },
      {
        id: 'm3',
        category: 'Football',
        league: 'Sky Sports Football',
        team1: 'Sky Sports',
        team2: 'Premier League',
        servers: [
          'https://www.redbull.com/embed/v3/tv/live/rrn:content:live-events:3a0f1fa8-1f14-411a-8e2b-231a48c6883e/en-INT'
        ]
      },
      {
        id: 'm4',
        category: 'Tennis',
        league: 'Tennis Channel HD',
        team1: 'Grand Slam Live',
        team2: 'Court Feed',
        servers: [
          'https://www.youtube.com/embed/live_stream?channel=UC4R8DWoMoI7CAwX8_LjQHig'
        ]
      }
    ];

    const channelsData = [
      { name: 'Star Sports 1', stream: 'https://www.youtube.com/embed/live_stream?channel=UC4R8DWoMoI7CAwX8_LjQHig', icon: 'fa-star', cat: 'Cricket' },
      { name: 'Ten Sports', stream: 'https://www.youtube.com/embed/live_stream?channel=UC4R8DWoMoI7CAwX8_LjQHig', icon: 'fa-baseball-bat-ball', cat: 'Cricket' },
      { name: 'Sky Sports Football', stream: 'https://www.redbull.com/embed/v3/tv/live/rrn:content:live-events:3a0f1fa8-1f14-411a-8e2b-231a48c6883e/en-INT', icon: 'fa-futbol', cat: 'Football' },
      { name: 'Tennis HD', stream: 'https://www.youtube.com/embed/live_stream?channel=UC4R8DWoMoI7CAwX8_LjQHig', icon: 'fa-table-tennis-paddle-ball', cat: 'Tennis' }
    ];

    let initialAdPool = [
      { id: 'ad1', title: 'Banner 1', targetUrl: '#', content: 'https://placehold.co/728x90/1e293b/38bdf8?text=Veedzi+Sports+Sponsor+1' },
      { id: 'ad2', title: 'Banner 2', targetUrl: '#', content: 'https://placehold.co/728x90/064e3b/34d399?text=Veedzi+Sports+Sponsor+2' }
    ];

    let adPool = JSON.parse(localStorage.getItem('veedzi_ad_pool')) || initialAdPool;
    let currentAdIndex = 0;
    let currentActiveMatch = matchesData[0];

    function renderMatchesList(data) {
      const container = document.getElementById('matches-list');
      if (!container) return;
      container.innerHTML = '';
      data.forEach(m => {
        const isActive = currentActiveMatch && currentActiveMatch.id === m.id;
        const div = document.createElement('div');
        div.onclick = () => loadMatchStream(m.id);
        div.className = `p-3 rounded-lg border cursor-pointer flex items-center justify-between transition ${isActive ? 'bg-slate-800 border-emerald-500 shadow-lg' : 'bg-slate-950 border-slate-800 hover:bg-slate-900'}`;
        div.innerHTML = `
          <div>
            <span class="text-[10px] text-emerald-400 font-bold uppercase">${m.league}</span>
            <div class="text-xs font-bold text-white mt-0.5">${m.team1} vs ${m.team2}</div>
          </div>
          <span class="px-2 py-0.5 bg-red-600/20 text-red-400 border border-red-500/30 text-[10px] font-bold rounded animate-pulse">LIVE</span>
        `;
        container.appendChild(div);
      });
    }

    function loadMatchStream(matchId) {
      const match = matchesData.find(m => m.id === matchId);
      if (!match) return;
      currentActiveMatch = match;
      document.getElementById('current-stream-title').textContent = `${match.league} - Live Stream`;
      document.getElementById('current-category').textContent = match.category;
      document.getElementById('main-player').src = match.servers[0];
      renderMatchesList(matchesData);
    }

    function switchServer(serverNum) {
      if (!currentActiveMatch || !currentActiveMatch.servers) return;
      const url = currentActiveMatch.servers[serverNum - 1] || currentActiveMatch.servers[0];
      document.getElementById('main-player').src = url;
      
      for(let i=1; i<=3; i++) {
        const btn = document.getElementById(`srv-${i}`);
        if(btn) {
          btn.className = i === serverNum ? 'px-2.5 py-1 rounded bg-emerald-600 text-white font-semibold' : 'px-2.5 py-1 rounded bg-slate-800 text-slate-300 hover:bg-slate-700';
        }
      }
    }

    function filterMatches(category) {
      ['all', 'Cricket', 'Football', 'Tennis'].forEach(cat => {
        const btn = document.getElementById(`cat-${cat}`);
        if(btn) {
          btn.className = cat === category ? 'px-3 py-1.5 rounded bg-emerald-600 text-white transition' : 'px-3 py-1.5 rounded bg-slate-800 text-slate-300 hover:bg-slate-700 transition';
        }
      });

      if (category === 'all') {
        renderMatchesList(matchesData);
      } else {
        const filtered = matchesData.filter(m => m.category.toLowerCase() === category.toLowerCase());
        renderMatchesList(filtered);
      }
    }

    function renderChannelsGrid() {
      const grid = document.getElementById('channels-grid');
      if (!grid) return;
      grid.innerHTML = '';
      channelsData.forEach(ch => {
        const btn = document.createElement('button');
        btn.onclick = () => { 
          document.getElementById('main-player').src = ch.stream;
          document.getElementById('current-stream-title').textContent = `${ch.name} - 24/7 Live`;
          document.getElementById('current-category').textContent = ch.cat;
        };
        btn.className = 'p-2.5 bg-slate-950 border border-slate-800 rounded hover:bg-slate-900 text-left flex items-center gap-2 transition';
        btn.innerHTML = `<i class="fa-solid ${ch.icon} text-emerald-400"></i> <span class="text-xs font-semibold text-slate-200 truncate">${ch.name}</span>`;
        grid.appendChild(btn);
      });
    }

    function rotateAds() {
      if (adPool.length === 0) return;
      const topAd = adPool[currentAdIndex % adPool.length];
      const playerAd = adPool[(currentAdIndex + 1) % adPool.length];
      const sidebarAd = adPool[(currentAdIndex + 2) % adPool.length];

      document.getElementById('ad-slot-top').innerHTML = `<a href="${topAd.targetUrl}" target="_blank" class="block w-full h-full"><img src="${topAd.content}" class="w-full h-full object-cover"></a>`;
      document.getElementById('ad-slot-player').innerHTML = `<a href="${playerAd.targetUrl}" target="_blank" class="block w-full h-full"><img src="${playerAd.content}" class="w-full h-full object-cover"></a>`;
      document.getElementById('ad-slot-sidebar').innerHTML = `<a href="${sidebarAd.targetUrl}" target="_blank" class="block w-full h-full"><img src="${sidebarAd.content}" class="w-full h-full object-cover"></a>`;

      currentAdIndex = (currentAdIndex + 1) % adPool.length;
    }

    function openAdModal() { document.getElementById('ad-modal').classList.remove('hidden'); }
    function closeAdModal() { document.getElementById('ad-modal').classList.add('hidden'); }

    function handleAddNewAd(e) {
      e.preventDefault();
      const title = document.getElementById('ad-title').value;
      const targetUrl = document.getElementById('ad-target-url').value;
      const content = document.getElementById('ad-content').value;
      adPool.push({ id: 'ad_'+Date.now(), title, targetUrl, content });
      localStorage.setItem('veedzi_ad_pool', JSON.stringify(adPool));
      closeAdModal();
      rotateAds();
    }

    window.onload = function() {
      renderMatchesList(matchesData);
      renderChannelsGrid();
      rotateAds();
      setInterval(rotateAds, 12000);
    };
  </script>
</body>
</html>
