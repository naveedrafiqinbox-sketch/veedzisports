  <script>
    function changeStream(url, title) {
      document.getElementById('main-player').src = url;
      document.getElementById('current-stream-title').textContent = title;
    }

    function promptCustomStream() {
      let customUrl = prompt("Apne live match ka iframe / embed link yahan paste karein (e.g. https://...):");
      if (customUrl) {
        document.getElementById('main-player').src = customUrl;
        document.getElementById('current-stream-title').textContent = "Custom Live Match Stream";
        alert("Live stream link update ho gaya hai!");
      }
    }
