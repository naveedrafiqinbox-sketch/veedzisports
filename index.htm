<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <!-- ================= SEO & TOP TRENDING KEYWORDS ================= -->
  <title>Veedzi Sports - Watch Free Live Sports Streaming HD, Cricket, Football & F1 Channels</title>
  <meta name="description" content="Veedzi Sports is your premier destination for free live sports streaming online. Watch ICC World Cup, IPL, PSL Cricket, Premier League Football, Champions League, Formula 1, Wimbledon Tennis, NBA, and 24/7 global sports TV channels in HD.">
  <meta name="keywords" content="Veedzi Sports, Veedzi Sports live, watch live sports free, live cricket stream hd, live football streaming, free ipl live stream, psl live streaming, epl stream live, formula 1 live stream free, red bull tv live, cbs sports stream, world sports channels online free, CricHD alternative, buffstreams alternative, sports live streaming server">
  <meta name="robots" content="index, follow">
  <meta name="author" content="Veedzi Sports Network">

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Google Font: Inter -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              red: '#E50914',
              green: '#10B981',
              dark: '#0F172A',
              card: '#1E293B',
              border: '#334155',
              accent: '#3B82F6'
            }
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <style>
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #0F172A; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #475569; }

    @keyframes pulse-fast {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }
    .animate-live { animation: pulse-fast 1.5s cubic-bezier(0.4, 0, 0.6, 1) infinite; }

    .aspect-video-container {
      position: relative;
      padding-bottom: 56.25%;
      height: 0;
      overflow: hidden;
    }
    .aspect-video-container iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen flex flex-col">

  <!-- TOP AD BANNER SLOT -->
  <div class="bg-slate-900 border-b border-slate-800 py-2 px-4 text-center text-xs">
    <div class="max-w-7xl mx-auto flex flex-col items-center justify-center">
      <div class="flex items-center justify-between w-full max-w-4xl text-slate-400 mb-1">
        <span class="text-[10px] uppercase tracking-wider font-semibold">Advertisement (Top Banner)</span>
        <span id="top-ad-timer" class="text-[10px] text-brand-accent">Rotates in: 15s</span>
      </div>
      <div id="ad-slot-top" class="w-full max-w-[728px] h-[90px] bg-slate-800 border border-slate-700 rounded flex items-center justify-center overflow-hidden shadow-md"></div>
    </div>
  </div>

  <!-- HEADER -->
  <header class="bg-slate-900/90 backdrop-blur border-b border-slate-800 sticky top-0 z-40">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex items-center justify-between h-16">
        <div class="flex items-center space-x-3">
          <a href="#" class="flex items-center space-x-2">
            <div class="w-10 h-10 bg-gradient-to-tr from-blue-600 to-emerald-400 rounded-lg flex items-center justify-center text-white font-extrabold text-xl shadow-lg shadow-blue-500/20">
              <i class="fa-solid font-bold fa-bolt"></i>
            </div>
            <div>
              <span class="text-xl font-black tracking-tight text-white">Veedzi<span class="text-emerald-400">Sports</span></span>
              <span class="text-[10px] block font-bold tracking-widest text-sky-400 uppercase -mt-1">Global Live Network</span>
            </div>
          </a>
        </div>

        <nav class="hidden md:flex space-x-1 lg:space-x-2 font-medium text-sm">
          <a href="#" onclick="filterMatches('all')" class="px-3 py-2 rounded-md bg-slate-800 text-white transition">Home</a>
          <a href="#" onclick="filterMatches('Cricket')" class="px-3 py-2 rounded-md text-slate-300 hover:text-white hover:bg-slate-800 transition">Cricket</a>
          <a href="#" onclick="filterMatches('Football')" class="px-3 py-2 rounded-md text-slate-300 hover:text-white hover:bg-slate-800 transition">Football</a>
          <a href="#" onclick="filterMatches('Tennis')" class="px-3 py-2 rounded-md text-slate-300 hover:text-white hover:bg-slate-800 transition">Tennis</a>
          <a href="#" onclick="filterMatches('Formula 1')" class="px-3 py-2 rounded-md text-slate-300 hover:text-white hover:bg-slate-800 transition">F1</a>
        </nav>

        <div class="flex items-center space-x-3">
          <button onclick="openAdModal()" class="bg-amber-500/10 text-amber-400 hover:bg-amber-500/20 border border-amber-500/30 text-xs font-semibold px-3 py-2 rounded-lg flex items-center gap-2 transition">
            <i class="fa-solid fa-ad"></i>
            <span>Ad Manager</span>
          </button>
          <button onclick="location.reload()" class="p-2 text-slate-400 hover:text-white hover:bg-slate-800 rounded-lg transition" title="Refresh">
            <i class="fa-solid fa-arrows-rotate"></i>
          </button>
        </div>
      </div>
    </div>
  </header>

  <!-- MAIN CONTENT -->
  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 flex-1 w-full">
    <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
      
      <!-- PLAYER COLUMN -->
      <div class="lg:col-span-8 space-y-6">
        <div class="bg-slate-900 border border-slate-800 rounded-xl overflow-hidden shadow-2xl">
          <div class="bg-slate-950 px-4 py-3 border-b border-slate-800 flex flex-wrap items-center justify-between gap-2">
            <div class="flex items-center gap-3">
              <span id="current-category" class="bg-emerald-500/10 text-emerald-400 border border-emerald-500/30 text-[10px] font-bold uppercase px-2 py-0.5 rounded">Cricket</span>
              <h2 id="current-stream-title" class="text-sm sm:text-base font-bold text-white truncate max-w-[280px]">India vs Australia - Live Stream</h2>
            </div>
            <div class="flex items-center gap-1 text-xs">
              <span class="text-slate-400 mr-1">Servers:</span>
              <button onclick="switchServer(1)" id="srv-1" class="px-2.5 py-1 rounded bg-emerald-600 text-white font-semibold">S1</button>
              <button onclick="switchServer(2)" id="srv-2" class="px-2.5 py-1 rounded bg-slate-800 text-slate-300">S2</button>
              <button onclick="switchServer(3)" id="srv-3" class="px-2.5 py-1 rounded bg-slate-800 text-slate-300">S3</button>
            </div>
          </div>

          <div class="bg-black aspect-video-container relative">
            <iframe id="main-player" src="https://www.redbull.com/embed/v3/tv/live/rrn:content:live-events:3a0f1fa8-1f14-411a-8e2b-231a48c6883e/en-INT" allowfullscreen allow="autoplay"></iframe>
            <div class="absolute top-3 left-3 bg-black/70 backdrop-blur text-slate-300 text-[11px] px-2.5 py-1 rounded-md border border-white/10 flex items-center gap-2">
              <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
              <span id="player-status-text">Live Signal Active</span>
            </div>
          </div>
        </div>

        <!-- AD SLOT PLAYER -->
        <div class="bg-slate-900 border border-slate-800 rounded-xl p-3 text-center">
          <div class="flex items-center justify-between text-slate-400 text-[10px] uppercase font-semibold mb-2">
            <span>Advertisement</span>
            <span id="player-ad-timer" class="text-brand-accent">Rotates in: 15s</span>
          </div>
          <div id="ad-slot-player" class="w-full h-[100px] bg-slate-950 border border-slate-800 rounded-lg flex items-center justify-center overflow-hidden"></div>
        </div>

        <!-- MATCHES LIST -->
        <div class="bg-slate-900 border border-slate-800 rounded-xl p-4">
          <h3 class="text-base font-bold text-white flex items-center gap-2 mb-4">
            <i class="fa-solid fa-tower-broadcast text-red-500"></i> Live Sports Fixtures
          </h3>
          <div id="matches-list" class="space-y-2.5"></div>
        </div>
      </div>

      <!-- SIDEBAR COLUMN -->
      <div class="lg:col-span-4 space-y-6">
        <div class="bg-slate-900 border border-slate-800 rounded-xl p-3 text-center">
          <div class="flex items-center justify-between text-slate-400 text-[10px] uppercase font-semibold mb-2">
            <span>Sidebar Ad</span>
            <span id="sidebar-ad-timer" class="text-brand-accent">Rotates in: 15s</span>
          </div>
          <div id="ad-slot-sidebar" class="w-full h-[250px] bg-slate-950 border border-slate-800 rounded-lg flex items-center justify-center overflow-hidden"></div>
        </div>

        <div class="bg-slate-900 border border-slate-800 rounded-xl p-4">
          <h3 class="text-base font-bold text-white flex items-center gap-2 mb-4">
            <i class="fa-solid fa-tv text-emerald-400"></i> 24/7 Channels
          </h3>
          <div class="grid grid-cols-2 gap-2.5" id="channels-grid"></div>
        </div>
      </div>
    </div>
  </main>

  <!-- AD MODAL -->
  <div id="ad-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-slate-900 border border-slate-700 w-full max-w-xl rounded-xl p-6 space-y-4">
      <div class="flex justify-between items-center border-b border-slate-800 pb-3">
        <h3 class="text-lg font-bold text-white">Ad Banner Manager</h3>
        <button onclick="closeAdModal()" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark text-xl"></i></button>
      </div>
      <form id="add-ad-form" onsubmit="handleAddNewAd(event)" class="space-y-3">
        <input type="text" id="ad-title" placeholder="Ad Banner Title" required class="w-full bg-slate-950 border border-slate-700 rounded px-3 py-2 text-white">
        <input type="url" id="ad-target-url" placeholder="Target Link (https://...)" class="w-full bg-slate-950 border border-slate-700 rounded px-3 py-2 text-white">
        <textarea id="ad-content" rows="2" placeholder="Image URL or Iframe Code" required class="w-full bg-slate-950 border border-slate-700 rounded px-3 py-2 text-white"></textarea>
        <button type="submit" class="w-full bg-amber-500 text-slate-950 font-bold py-2 rounded">Add Ad to Rotation</button>
      </form>
      <div class="flex justify-end">
        <button onclick="closeAdModal()" class="bg-slate-800 text-white px-4 py-2 rounded text-xs">Close</button>
      </div>
    </div>
  </div>

  <!-- SCRIPTS -->
  <script>
    const matchesData = [
      {
        id: 'm1',
        category: 'Cricket',
        league: 'ICC Live Feed',
        team1: 'India', flag1: '🇮🇳',
        team2: 'Australia', flag2: '🇦🇺',
        status: 'LIVE',
        servers: [
          'https://www.redbull.com/embed/v3/tv/live/rrn:content:live-events:3a0f1fa8-1f14-411a-8e2b-231a48c6883e/en-INT',
          'https://www.youtube.com/embed/live_stream?channel=UC4R8DWoMoI7CAwX8_LjQHig'
        ]
      },
      {
        id: 'm2',
        category: 'Football',
        league: 'Champions League',
        team1: 'Real Madrid', flag1: '🇪🇸',
        team2: 'Barcelona', flag2: '🇪🇸',
        status: 'LIVE',
        servers: [
          'https://www.youtube.com/embed/live_stream?channel=UC4R8DWoMoI7CAwX8_LjQHig',
          'https://www.redbull.com/embed/v3/tv/live/rrn:content:live-events:3a0f1fa8-1f14-411a-8e2b-231a48c6883e/en-INT'
        ]
      }
    ];

    const channelsData = [
      { name: 'Red Bull TV', icon: 'fa-bolt', color: 'text-amber-400', stream: 'https://www.redbull.com/embed/v3/tv/live/rrn:content:live-events:3a0f1fa8-1f14-411a-8e2b-231a48c6883e/en-INT' },
      { name: 'Sports HQ', icon: 'fa-tv', color: 'text-sky-400', stream: 'https://www.youtube.com/embed/live_stream?channel=UC4R8DWoMoI7CAwX8_LjQHig' }
    ];

    const initialAdPool = [
      { id: 'ad1', title: 'Banner 1', targetUrl: '#', content: 'https://placehold.co/728x90/1e293b/38bdf8?text=Veedzi+Sports+Ad+1' },
      { id: 'ad2', title: 'Banner 2', targetUrl: '#', content: 'https://placehold.co/728x90/064e3b/34d399?text=Veedzi+Sports+Ad+2' }
    ];

    let adPool = JSON.parse(localStorage.getItem('veedzi_ads')) || initialAdPool;
    let currentAdIndex = 0;
    let currentActiveMatch = matchesData[0];

    function loadMatchStream(matchId) {
      const match = matchesData.find(m => m.id === matchId);
      if (!match) return;
      currentActiveMatch = match;
      document.getElementById('current-stream-title').textContent = `${match.team1} vs ${match.team2} - Live`;
      document.getElementById('main-player').src = match.servers[0];
      renderMatchesList(matchesData);
    }

    function switchServer(serverNum) {
      if (!currentActiveMatch || !currentActiveMatch.servers) return;
      const url = currentActiveMatch.servers[serverNum - 1] || currentActiveMatch.servers[0];
      document.getElementById('main-player').src = url;
      
      for(let i=1; i<=3; i++) {
        const btn = document.getElementById(`srv-${i}`);
        if(btn) btn.className = i === serverNum ? 'px-2.5 py-1 rounded bg-emerald-600 text-white font-semibold' : 'px-2.5 py-1 rounded bg-slate-800 text-slate-300';
      }
    }

    function renderMatchesList(data) {
      const container = document.getElementById('matches-list');
      if (!container) return;
      container.innerHTML = '';
      data.forEach(m => {
        const isActive = currentActiveMatch && currentActiveMatch.id === m.id;
        const item = document.createElement('div');
        item.onclick = () => loadMatchStream(m.id);
        item.className = `p-3 rounded-lg border cursor-pointer flex items-center justify-between ${isActive ? 'bg-slate-800 border-emerald-500' : 'bg-slate-950 border-slate-800'}`;
        item.innerHTML = `<span class="text-xs font-bold text-white">${m.flag1} ${m.team1} vs ${m.flag2} ${m.team2}</span><span class="px-2 py-0.5 bg-red-600/20 text-red-400 text-[10px] font-bold rounded">LIVE</span>`;
        container.appendChild(item);
      });
    }

    function renderChannelsGrid() {
      const grid = document.getElementById('channels-grid');
      if (!grid) return;
      grid.innerHTML = '';
      channelsData.forEach(ch => {
        const btn = document.createElement('button');
        btn.onclick = () => { document.getElementById('main-player').src = ch.stream; };
        btn.className = 'p-2.5 bg-slate-950 border border-slate-800 rounded hover:bg-slate-800 text-left';
        btn.innerHTML = `<i class="fa-solid ${ch.icon} ${ch.color}"></i> <span class="text-xs font-semibold text-slate-200 ml-2">${ch.name}</span>`;
        grid.appendChild(btn);
      });
    }

    function rotateAds() {
      if (adPool.length === 0) return;
      const topAd = adPool[currentAdIndex % adPool.length];
      const playerAd = adPool[(currentAdIndex + 1) % adPool.length];
      const sidebarAd = adPool[(currentAdIndex + 2) % adPool.length];

      document.getElementById('ad-slot-top').innerHTML = `<a href="${topAd.targetUrl}" target="_blank"><img src="${topAd.content}" class="w-full h-full object-cover"></a>`;
      document.getElementById('ad-slot-player').innerHTML = `<a href="${playerAd.targetUrl}" target="_blank"><img src="${playerAd.content}" class="w-full h-full object-cover"></a>`;
      document.getElementById('ad-slot-sidebar').innerHTML = `<a href="${sidebarAd.targetUrl}" target="_blank"><img src="${sidebarAd.content}" class="w-full h-full object-cover"></a>`;

      currentAdIndex = (currentAdIndex + 1) % adPool.length;
    }

    function openAdModal() { document.getElementById('ad-modal').classList.remove('hidden'); }
    function closeAdModal() { document.getElementById('ad-modal').classList.add('hidden'); }

    function handleAddNewAd(e) {
      e.preventDefault();
      const title = document.getElementById('ad-title').value;
      const targetUrl = document.getElementById('ad-target-url').value;
      const content = document.getElementById('ad-content').value;
      adPool.push({ id: 'ad_'+Date.now(), title, targetUrl, content });
      localStorage.setItem('veedzi_ads', JSON.stringify(adPool));
      closeAdModal();
      rotateAds();
    }

    window.onload = function() {
      renderMatchesList(matchesData);
      renderChannelsGrid();
      rotateAds();
      setInterval(rotateAds, 12000);
    };
  </script>
</body>
</html>
